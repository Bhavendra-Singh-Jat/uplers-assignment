<div class="contentSection">
    <h2>Search</h2>
    <input type="text" name="search" placeholder="Search..">



    <div class="informationSection">
        <div class="leftSection">
            <div class="card p-5">
                <div class="card" *ngFor="let filter of filters">
                    <div class="accordianSection">
                        <div>
                            <i class="fa fa-angle-down"></i>
                            <span>{{filter.title}}</span>
                        </div>
                        <input type="checkbox">
                    </div>
                </div>
            </div>
        </div>
        <div class="rightSection">
            <div class="head p-5">
                <span>{{itemsSections.length}} Results Found</span>
                <button class="sort" (click)="poupOpenFunction(sortComponent)">Sort</button>
            </div>

            <div class="itemSection">
                <div class="card" *ngFor="let item of itemsSections">
                    <div class="itemImage">
                        <div class="position-relative">
                            <img [src]="item.display_img_url" alt="">
                            <span [ngClass]="item.quantity === 0 ? 'outOfStock' : ''">
                                {{item.quantity === 0 ? '(Out Of Stock)' : ''}}
                            </span>
                        </div>
                        <div class="info pb-0">
                            <span style="font-weight: 800;">{{item.name}}</span>
                            <span>{{item.points}} Points</span>
                            <hr class="mb-0">
                        </div>
                        <div class="d-flex justify-content-center p-4">
                            <span class="text-secondary">Valid Until &nbsp;</span>
                            <span>{{item.valid_until}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #sortComponent let-modal>
    <div class="modal-body">
        <div class="filterBy">
            <h4>Filter By</h4>
            <span>Reset All</span>
        </div>
        <hr>
        <div class="sortFilter">
            <div [ngClass]="selected === 1 ? 'selectedSort':''" (click)="selected = 1">A to Z</div>
            <div [ngClass]="selected === 2 ? 'selectedSort':''" (click)="selected = 2">Z to A</div>
        </div>
    </div>

    <div class="modal-footer">
        <button class="sort w-100" (click)="applyFilter()">Apply</button>
    </div>
</ng-template>
